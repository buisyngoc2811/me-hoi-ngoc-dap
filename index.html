<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mẹ Hỏi Ngọc Đáp</title>
    
    <!-- PWA settings -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ngọc Đáp">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="avatar">
                    <img src="./ngoc-avatar.jpg" alt="Avatar Ngọc" onerror="this.src='./icon-192.png'">
                    <span class="status-indicator"></span>
                </div>
                <div class="header-info">
                    <h1>Mẹ Hỏi Ngọc Đáp</h1>
                    <p>Luôn yêu thương mẹ nhất trần đời 💖</p>
                </div>
                <button id="text-size-btn" class="icon-btn" aria-label="Đổi cỡ chữ" style="font-weight: bold; font-size: 1.2rem;">A+</button>
                <button id="settings-btn" class="icon-btn" aria-label="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </header>

        <!-- API Key Modal -->
        <div id="api-modal" class="modal hidden">
            <div class="modal-content glass-effect">
                <h2>Cài Đặt Bí Mật</h2>
                <p>Mẹ nhập "Chìa Khóa Phép Thuật" (Gemini API Key) vào đây nhé để Ngọc thông minh hơn nha!</p>
                <p class="small-text">Lấy mã miễn phí tại: <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a></p>
                <input type="password" id="api-key-input" placeholder="Dán API Key vào đây...">
                <div class="modal-actions">
                    <button id="save-api-btn" class="primary-btn">Lưu lại</button>
                    <button id="close-modal-btn" class="secondary-btn">Đóng</button>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <main class="chat-container" id="chat-container">
            <!-- Messages will be injected here -->
            <div class="message ai-message welcome-message">
                <div class="message-bubble">
                    Dạ con chào Mẹ! Mẹ cần con giúp gì ạ? 😊
                </div>
            </div>
        </main>

        <!-- Typing indicator -->
        <div class="typing-indicator-container hidden" id="typing-indicator">
            <div class="typing-bubble">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <span class="typing-text">Ngọc đang gõ...</span>
        </div>

        <!-- Input Area -->
        <footer class="input-area">


            <div id="image-preview-container" class="image-preview-container hidden">
                <img id="image-preview" src="" alt="Preview">
                <button id="remove-image-btn" aria-label="Xóa ảnh">×</button>
            </div>
            <div class="input-wrapper glass-effect">
                <label id="attach-btn" for="image-input" aria-label="Gửi hình ảnh">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                </label>
                <input type="file" id="image-input" accept="image/*" class="hidden">
                
                <input type="text" id="user-input" placeholder="Mẹ hỏi con gì đi..." autocomplete="off">
                
                <button id="mic-btn" aria-label="Nhập bằng giọng nói">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                </button>
                
                <button id="send-btn" aria-label="Gửi tin nhắn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
